name: 'MCP Health Check'
description: 'Vérifie la conformité de votre serveur MCP et calcule un score aligné sur le NIST AI RMF, avant que vos utilisateurs ne le découvrent eux-mêmes.'
author: 'Toi'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  server-command:
    description: "Commande pour lancer votre serveur MCP (ex: 'python3 my_server.py')"
    required: true
  min-score:
    description: "Score minimum requis (%) pour que le job réussisse"
    required: false
    default: '70'
  enable-blockchain-anchor:
    description: "Ancre un hash du rapport sur OpenTimestamps (Bitcoin). Ajoute un appel réseau externe, désactivé par défaut."
    required: false
    default: 'false'
  submit-to-leaderboard:
    description: "Soumet automatiquement le score au classement public MCP Trust Score"
    required: false
    default: 'false'
  leaderboard-api-url:
    description: "URL de l'API de classement (requis si submit-to-leaderboard=true)"
    required: false
    default: ''

outputs:
  score:
    description: "Score de conformité NIST AI RMF obtenu (%)"
    value: ${{ steps.run-check.outputs.score }}
  axiom_score:
    description: "Score de signaux techniques AXIOM (Domaines 4 et 5, %)"
    value: ${{ steps.run-check.outputs.axiom_score }}
  owasp_score:
    description: "Score de signaux techniques OWASP MCP Top 10 (2 catégories sur 10, %)"
    value: ${{ steps.run-check.outputs.owasp_score }}
  blockchain_proof:
    description: "Chemin du fichier de preuve OpenTimestamps (.ots), vide si non activé ou échec"
    value: ${{ steps.run-check.outputs.blockchain_proof }}
  passed:
    description: "true/false selon que le score dépasse min-score"
    value: ${{ steps.run-check.outputs.passed }}
  reachable:
    description: "true/false selon que le serveur a répondu"
    value: ${{ steps.run-check.outputs.reachable }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      shell: bash
      run: pip install mcp opentimestamps-client requests

    - name: Run MCP Health Check
      id: run-check
      shell: bash
      run: python3 ${{ github.action_path }}/run_action.py
      env:
        INPUT_SERVER-COMMAND: ${{ inputs.server-command }}
        INPUT_MIN-SCORE: ${{ inputs.min-score }}
        INPUT_ENABLE-BLOCKCHAIN-ANCHOR: ${{ inputs.enable-blockchain-anchor }}
        INPUT_SUBMIT-TO-LEADERBOARD: ${{ inputs.submit-to-leaderboard }}
        INPUT_LEADERBOARD-API-URL: ${{ inputs.leaderboard-api-url }}
